
<!DOCTYPE html>
<html>
<head>
    <title>Upload History</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#2563eb;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        img{
            width:100px;
            height:80px;
            object-fit:cover;
            border-radius:8px;
        }

        .home-btn{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:10px 15px;
            border-radius:8px;
        }

    </style>

</head>

<body>

<h1>Upload History</h1>

<a href="/" class="home-btn">🏠 Home</a>

<br><br>

<table border="1">

<tr>
    <th>ID</th>
    <th>Thumbnail</th>
    <th>Image Name</th>
    <th>Result</th>
    <th>Confidence</th>
    <th>Upload Time</th>
</tr>

{% for row in rows %}

<tr>

    <td>{{ row[0] }}</td>

    <td>
       <img src="{{ url_for('uploaded_file', filename=row[1]) }}">
    </td>

    <td>{{ row[1] }}</td>

    <td>{{ row[2] }}</td>

    <td>{{ row[3] }}%</td>

    <td>{{ row[4] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
